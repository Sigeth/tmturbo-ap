# Example player YAML for the Trackmania Turbo Archipelago world.
# Drop this into archipelago/Players/ and run `python Generate.py`.
# Also used by CI as a generation smoke test.
name: Sigeth
description: "Trackmania Turbo - default vanilla campaign progression"
game: Trackmania Turbo
Trackmania Turbo:
  progression_balancing: 50
  accessibility: full

  # vanilla (default) | progressive | individual (not implemented)
  unlock_style: vanilla

  # campaign_finish (default) | author_times
  goal: campaign_finish

  # Lowest medal that sends a check. Only the progressive/individual styles
  # consult this - vanilla is always Gold + Author.
  medals_required: gold
